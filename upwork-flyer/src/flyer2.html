<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>

.list{margin-top:46px;font-size:27px;line-height:1.75}
.list div:before{content:"✦";color:#C9A46A;margin-right:14px}
.bottom{position:absolute;left:100px;right:100px;bottom:100px;display:flex;align-items:center;justify-content:space-between}
